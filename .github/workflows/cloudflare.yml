# Every pull request and every push to main: the site built for Cloudflare Workers exactly the
# way Workers Builds builds it. No Cloudflare account or token is used — nothing here deploys.
# Its only job is to fail here instead of in the dashboard.
name: Cloudflare Workers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # The same command as the Build command in Workers Builds: next build, then OpenNext's Worker.
      - run: npm run cf:build
      # The Worker's size against Cloudflare's limit, and the static assets against the free
      # plan's. --dry-run needs no account and uploads nothing.
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
