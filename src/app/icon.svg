<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="جيسي">
  <!--
    The tab icon. The site had none at all and every page load asked for /favicon.ico and got a
    404. It is her pearl on her navy, with the gold of her chain as a hairline: the three colours
    of the page and nothing else, so it still reads at 16px where a face never would.
  -->
  <defs>
    <radialGradient id="pearl" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f4eee6" />
      <stop offset="100%" stop-color="#d9ccbb" />
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#1B2A4A" />
  <circle cx="16" cy="16" r="9.25" fill="none" stroke="#C9A227" stroke-width="1.25" opacity="0.85" />
  <circle cx="16" cy="16" r="5.4" fill="url(#pearl)" />
  <circle cx="13.9" cy="13.8" r="1.25" fill="#ffffff" opacity="0.9" />
</svg>
